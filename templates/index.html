<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortex Quotex Signal Generator</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:18px;background:#f4f5f7}.c{background:#fff;padding:18px;margin:12px 0;border-radius:14px}input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;font-size:16px}button{font-weight:700}.r{text-align:center;font-size:32px;font-weight:900;margin:12px}pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}.small{color:#555;font-size:13px}</style></head><body><h1>Cortex Quotex Signal Generator</h1><div class=c><b>Quotex SSID / Session ID</b><input id=ssid type=password autocomplete=off placeholder="Paste SSID"><div class=small>SSID is never included in transport diagnostics.</div></div><div class=c><select id=a><option>EURUSD_otc</option><option>GBPUSD_otc</option><option>USDJPY_otc</option><option>EURJPY_otc</option><option>AUDCAD_otc</option><option>CADJPY_otc</option><option>USDCHF_otc</option><option>GBPJPY_otc</option></select><select id=t><option value=1m>1 minute</option><option value=5m>5 minutes</option><option value=15m>15 minutes</option></select><select id=e><option value=1>1 minute expiry</option><option value=5>5 minutes expiry</option><option value=15>15 minutes expiry</option></select><button onclick=analyze()>Analyze</button></div><div class=c><div id=r class=r>NO SIGNAL</div><div id=d>Waiting...</div></div><div class=c><b>Transport diagnostic</b><pre id=diag>Not run.</pre></div><script>async function analyze(){r.textContent='CONNECTING...';d.textContent='Fetching verified Quotex candles...';diag.textContent='Running...';try{const x=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:ssid.value,asset:a.value,timeframe:t.value,expiry:e.value})});const j=await x.json();r.textContent=j.signal||'ERROR';d.textContent=j.message||((j.analysis&&j.analysis.note)||j.error)||'Done';diag.textContent=JSON.stringify(j.diagnostics||j,null,2)}catch(e){r.textContent='ERROR';d.textContent=e.message;diag.textContent=e.stack||String(e)}}</script></body></html>
