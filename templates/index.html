<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortex Signal Generator</title><style>body{font-family:system-ui;max-width:700px;margin:auto;padding:18px;background:#f4f5f7}.c{background:#fff;padding:18px;margin:12px 0;border-radius:12px}input,select,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{font-weight:700}.r{text-align:center;font-size:28px;font-weight:800}</style></head><body><h1>Cortex Simple Signal Generator</h1><div class=c><b>SSID / Session ID</b><input id=ssid type=password placeholder="Paste SSID"><button onclick=connect()>Connect</button><div id=s>Status: Not connected</div></div><div class=c><select id=a><option>EURUSD_otc</option><option>GBPUSD_otc</option><option>USDJPY_otc</option><option>EURJPY_otc</option><option>AUDCAD_otc</option><option>CADJPY_otc</option></select><select id=t><option value=1m>1 minute</option><option value=5m>5 minutes</option><option value=15m>15 minutes</option></select><select id=e><option value=1>1 minute</option><option value=5>5 minutes</option></select><button onclick=analyze()>Analyze</button></div><div class=c><div id=r class=r>NO SIGNAL</div><div id=d></div></div><script>async function connect(){let x=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid:ssid.value})});let j=await x.json();s.textContent=j.message||j.error}async function analyze(){r.textContent='ANALYZING...';let x=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({asset:a.value,timeframe:t.value,expiry:e.value})});let j=await x.json();r.textContent=j.signal||'NO SIGNAL';d.textContent=j.message||j.error||''}</script></body></html>
